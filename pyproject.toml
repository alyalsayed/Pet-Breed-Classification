[project]
name = "pet-breed-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alyalsayed", email = "alyalsayed56@yahoo.com" }
]
requires-python = ">=3.12"

dependencies = [
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "torch",
    "torchvision",
]

[project.scripts]
pet-breed-classification = "pet_breed_classification:main"
data = "pet_breed_classification.data:make_splits"
train = "pet_breed_classification.train:main"
predict = "pet_breed_classification.predict:main"
manifest = "pet_breed_classification.manifest:build_manifest"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography>=49.0.0",
    "dvc[gdrive]>=3.67.1",
    "pyopenssl>=26.4.0",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
